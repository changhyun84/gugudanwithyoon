# GitHub Pages 배포 — main에 밀어 넣으면 자동으로 올라갑니다.
#
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾸세요.
# 주소는 https://{아이디}.github.io/{저장소}/ 이고, 부모 화면은 뒤에 parent.html 을 붙입니다.
#
# 아이 진행은 각자 브라우저에 남습니다. 서버에 아무것도 안 올라갑니다 —
# 그래서 다른 집 아이 기록을 이쪽에서 갖고 있지 않습니다.

name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - 'sim/build-static.py'
      - 'server.py'
      - 'packs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 문제 파일이 깨졌으면 여기서 멈춘다. 아이에게 나가기 전에 잡는 게 낫다.
      - name: 검사
        run: |
          for t in test/*.mjs; do echo "--- $t"; node "$t"; done

      - name: 빌드
        run: python3 sim/build-static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
